version: 2

release:
  # Mark -beta/-rc tags as GitHub pre-releases so a beta never takes the
  # "Latest" slot that install scripts and `gh release view --latest` read.
  prerelease: auto

builds:
  - id: skret
    main: ./cmd/skret
    binary: skret
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/n24q02m/skret/internal/version.Version={{.Version}}
      - -X github.com/n24q02m/skret/internal/version.Commit={{.Commit}}
      - -X github.com/n24q02m/skret/internal/version.Date={{.CommitTimestamp}}
  - id: skret-secret-helper
    main: ./cmd/skret-secret-helper
    binary: skret-secret-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: skret-compose-supervisor
    main: ./cmd/skret-compose-supervisor
    binary: skret-compose-supervisor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: cli
    ids:
      - skret
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "skret_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: secret-helper
    ids:
      - skret-secret-helper
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "skret-secret-helper_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: compose-supervisor
    ids:
      - skret-compose-supervisor
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "skret-compose-supervisor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# dockers_v2 replaces the deprecated dockers/docker_manifests pair; it becomes
# plain `dockers` in GoReleaser v3. It always goes through docker buildx, which
# is why cd.yml now sets up qemu and a buildx builder before this runs.
#
# Neither of the two old build_flag_templates carried over, and neither is
# missing. `--pull` cannot change anything when the base is pinned by digest
# (FROM alpine:<tag>@sha256:... names one immutable multi-arch index, and
# buildx takes each platform's image from it), and the
# --label=org.opencontainers.image.source flag only restated the LABEL the
# Dockerfile already carries.
dockers_v2:
  - images:
      - "ghcr.io/n24q02m/skret"
    tags:
      - "{{ .Version }}"
      # A prerelease must not take :latest -- the same line release.prerelease
      # holds on the GitHub release and cd.yml's taps job holds on the tap and
      # the bucket. The old dockers block had no such guard and pushed :latest on
      # every tag, so a beta silently moved the tag that a bare `docker run
      # ghcr.io/n24q02m/skret` and every unpinned FROM resolve to. An empty tag
      # is dropped, so a stable release still gets it.
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    # The arm64 binary has always been built and archived; it just never
    # reached a container, because the old dockers block was single-arch.
    platforms:
      - linux/amd64
      - linux/arm64

# One SBOM per archive, in SPDX JSON: the format cd.yml asks syft for when
# it catalogs the OCI archives and the Hub, executor and docs bundles. The
# command, format and file names are spelled out instead of inherited from
# GoReleaser's defaults, so a GoReleaser upgrade cannot change them.
# GoReleaser's default "--enrich all" is left out, as in cd.yml: enrichment
# makes syft query online package sources during the release, so the SBOM
# would depend on the network instead of only on the archive.
# SYFT_FILE_METADATA_CATALOGER_ENABLED (GoReleaser's default) is kept: it adds
# each file in the archive with its digests, which ties the SBOM to the exact
# binary it describes, and it reads nothing but the archive.
sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
