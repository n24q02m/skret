version: 2

release:
  # A transient GitHub upload error mid-publish leaves the release with a
  # partial asset set; without this flag a rerun dies on 422 already_exists
  # for every asset that did land, so the scoop/brew/docker publishers after
  # the upload step never run (v1.14.0, run 29544187972).
  replace_existing_artifacts: true
  # Mark -beta/-rc tags as GitHub pre-releases so a beta never takes the
  # "Latest" slot that install scripts and `gh release view --latest` read.
  prerelease: auto

builds:
  - id: skret
    main: ./cmd/skret
    binary: skret
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/n24q02m/skret/internal/version.Version={{.Version}}
      - -X github.com/n24q02m/skret/internal/version.Commit={{.Commit}}
      - -X github.com/n24q02m/skret/internal/version.Date={{.Date}}

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "skret_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - repository:
      owner: n24q02m
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://skret.n24q02m.com"
    description: "Cloud-provider secret manager CLI with Doppler/Infisical-grade DX"
    license: "MIT"
    binaries:
      - skret
    # The formula ran generate_completions_from_executable(bin/"skret",
    # "completion"); the cask spelling is this structured field. Without it a
    # brew install silently loses tab completion, which the formula shipped.
    generate_completions_from_executable:
      args: [completion]
      shell_parameter_format: cobra
      # Pinned, not left to the cobra default. That default includes "pwsh",
      # and `skret completion pwsh` exits 8 with `unknown shell "pwsh"` - the
      # command spells it "powershell". Naming the four shells skret actually
      # accepts keeps the generator off a name that fails.
      shells: [bash, zsh, fish, powershell]
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump skret to {{ .Tag }}"
    # homebrew-tap is the channel `brew install skret` reads, so a prerelease
    # build must never overwrite the cask there: someone installing during a
    # beta window would silently get the beta. release.prerelease: auto keeps
    # prerelease tags out of GitHub's "Latest" slot; skip_upload: auto applies
    # the same policy one layer down, skipping this bump on a prerelease tag.
    skip_upload: "auto"

scoops:
  - repository:
      owner: n24q02m
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://skret.n24q02m.com"
    description: "Cloud-provider secret manager CLI with Doppler/Infisical-grade DX"
    license: MIT
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump skret to {{ .Tag }}"
    # Same reasoning as the brews entry above: scoop-bucket is the stable
    # channel for `scoop install skret`, so a prerelease must not overwrite the
    # manifest there.
    skip_upload: "auto"

dockers:
  - image_templates:
      - "ghcr.io/n24q02m/skret:{{ .Version }}"
      - "ghcr.io/n24q02m/skret:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.source=https://github.com/n24q02m/skret"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
