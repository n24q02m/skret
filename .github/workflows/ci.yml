name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-bootstrap-verify:
    name: Verify README sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify README sync
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  pr-title:
    name: PR Title Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        shell: bash
        run: |
          # Captured, not piped into tee: the per-package figures below are read
          # from this output, and `go test | tee` would hand the step tee's exit
          # code, turning a failing suite green. GitHub's bash sets pipefail, but
          # this same script gets run by hand, where it does not.
          if ! go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... > internal-test.txt; then
            cat internal-test.txt
            exit 1
          fi
          cat internal-test.txt
          go test -race -coverprofile=coverage-pkg.out -covermode=atomic ./pkg/skret/...
      - name: Check internal coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Internal coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Internal coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
      # The 90% above is an average over ./internal/..., and an average hides a
      # single rotten package behind the healthy ones: internal/cli is large
      # enough that a small package could fall to 50% without moving the
      # aggregate off 90. This floor is per package, deliberately set below
      # today's worst (89.1%, internal/provider/local) so it catches a package
      # sliding rather than bikeshedding the packages that already pass.
      - name: Check per-package coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          below=$(awk -v floor=85 '
            /coverage:/ {
              c = ""
              for (i = 1; i <= NF; i++) if ($i == "coverage:") c = $(i + 1)
              if (c !~ /%$/) next          # "[no statements]" -- nothing to measure
              sub(/%$/, "", c)
              if (c + 0 < floor) printf "  %s  %s%%\n", $2, c
            }' internal-test.txt)
          if [ -n "$below" ]; then
            echo "These packages are below the 85% per-package floor:"
            echo "$below"
            exit 1
          fi
          echo "Every internal package is at or above the 85% floor."
      - name: Check pkg/skret coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage-pkg.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "pkg/skret coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
            echo "pkg/skret coverage ${COVERAGE}% is below 95% threshold"
            exit 1
          fi
      - name: Run E2E tests
        shell: bash
        run: go test -count=1 ./tests/e2e/...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          file: ./coverage.out
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY=skret
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=skret.exe
          fi
          go build -ldflags="-s -w -X github.com/n24q02m/skret/internal/version.Version=ci-${{ github.sha }}" -o $BINARY ./cmd/skret

  arm64-native:
    name: Native ARM64 OCI parity
    # Plan prescription (fleet-runtime-security plan, Task 7): exact-candidate
    # ARM64 jobs run in CI on a native arm64 runner. This job builds both OCI
    # archives natively (no qemu), verifies them with scripts/oci_arm64_harness.py
    # verify_inputs, and smokes the CLI binary and the sync plan-server inside
    # real arm64 containers.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # The default docker driver cannot export OCI archives; the
      # docker-container driver (same pin as cd.yml) can.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build linux/arm64 CLI natively
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p context/linux/arm64
          go build -trimpath \
            -ldflags="-s -w -X github.com/n24q02m/skret/internal/version.Version=ci-${GITHUB_SHA::7}" \
            -o context/linux/arm64/skret ./cmd/skret
      # The repo Dockerfiles pin single-arch (amd64) base digests for the
      # amd64 release lane. This job rewrites them to the equivalent
      # linux/arm64 manifest digests (resolved from the same tags) so every
      # RUN step executes natively on the arm64 runner. CI-ephemeral only;
      # the checked-in Dockerfiles are untouched on disk in git.
      - name: Build CLI OCI archive (native arm64)
        run: |
          set -euo pipefail
          cp Dockerfile context/Dockerfile
          sed -i 's|alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f|alpine@sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c|' context/Dockerfile
          grep -q 'sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c' context/Dockerfile
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile context \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=0.0.0-ci-${GITHUB_SHA::7}" \
            --provenance=false --sbom=false \
            --output type=oci,dest=skret-cli.oci.tar
      - name: Build sync OCI archive (native arm64)
        run: |
          set -euo pipefail
          sed -i 's|golang:1.26-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2|golang:1.26-alpine@sha256:c9bc58ef02c419539a6bab6f970844ece1dd9953baf409264f2fa429378e12a7|' Dockerfile.sync
          sed -i 's|alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b|alpine:3.24@sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18|' Dockerfile.sync
          grep -q 'sha256:c9bc58ef02c419539a6bab6f970844ece1dd9953baf409264f2fa429378e12a7' Dockerfile.sync
          grep -q 'sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18' Dockerfile.sync
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile.sync . \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=0.0.0-ci-${GITHUB_SHA::7}" \
            --provenance=false --sbom=false \
            --output type=oci,dest=skret-sync.oci.tar
      - name: Smoke CLI inside a native arm64 container
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile context \
            --provenance=false --sbom=false \
            --load --tag skret-ci:cli
          out="$(docker run --rm skret-ci:cli --version)"
          echo "cli version: $out"
          case "$out" in
            *"ci-${GITHUB_SHA::7}"*) ;;
            *) echo "cli version mismatch" >&2; exit 1 ;;
          esac
      - name: Smoke sync plan-server inside a native arm64 container
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile.sync . \
            --provenance=false --sbom=false \
            --load --tag skret-ci:sync
          cid="$(docker run -d -p 18080:8080 skret-ci:sync)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              echo "plan-server healthz ok"
              exit 0
            fi
            sleep 1
          done
          echo "plan-server healthz failed" >&2
          exit 1
      - name: Verify both archives with the ARM64 harness
        run: |
          set -euo pipefail
          printf '{"schema":"offline-fixture"}\n' > launch-manifest.json
          printf 'live-a\n' > live-a
          printf 'live-b\n' > live-b
          dig() { printf 'sha256:%s' "$(sha256sum "$1" | cut -d' ' -f1)"; }
          jq -nc \
            --arg schema "skret-oci-arm64-harness/v1" \
            --arg candidate_version "0.0.0-ci-${GITHUB_SHA::7}" \
            --arg source_sha "$GITHUB_SHA" \
            --arg cli_archive "$PWD/skret-cli.oci.tar" \
            --arg cli_archive_digest "$(dig skret-cli.oci.tar)" \
            --arg sync_archive "$PWD/skret-sync.oci.tar" \
            --arg sync_archive_digest "$(dig skret-sync.oci.tar)" \
            --arg launch_manifest "$PWD/launch-manifest.json" \
            --arg launch_manifest_digest "$(dig launch-manifest.json)" \
            --arg live_a "$PWD/live-a" \
            --arg live_b "$PWD/live-b" \
            '{
              schema: $schema,
              candidate_version: $candidate_version,
              source_sha: $source_sha,
              cli_archive: $cli_archive,
              cli_archive_digest: $cli_archive_digest,
              cli_entrypoint: ["/usr/local/bin/skret"],
              sync_archive: $sync_archive,
              sync_archive_digest: $sync_archive_digest,
              sync_entrypoint: ["/usr/local/bin/sync-entrypoint.sh"],
              launch_manifest: $launch_manifest,
              launch_manifest_digest: $launch_manifest_digest,
              live_paths: ([$live_a, $live_b] | sort),
              platform: "linux/arm64"
            }' | python3 -c "import json,sys;sys.stdout.write(json.dumps(json.load(sys.stdin),sort_keys=True,separators=(',',':')))" > spec.json
          python3 scripts/oci_arm64_harness.py --spec "$PWD/spec.json" || {
            status=$?
            echo "--- harness failed; spec diagnostics ---" >&2
            cat spec.json >&2
            exit $status
          }

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # GitHub default setup owns SARIF upload for this repository. The
          # pinned advanced job still builds and analyzes locally, but must not
          # submit a second CodeQL configuration.
          upload: never

  scorecard:
    name: Scorecard analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif



  installer-lint:
    name: Installer scripts lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: "."
          additional_files: "install.sh"
          severity: warning
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning -EnableExit

  installer-smoke:
    name: Installer smoke test (${{ matrix.os }})
    # Gate behind workflow_dispatch for PRs: the scripts hit the live GitHub API
    # for the latest release tag, and we do not want a PR's CI to block on external
    # reachability or hit rate limits on every push.
    #
    # This used to also read `|| startsWith(github.ref, 'refs/tags/v')`, which was
    # never once true: this workflow has no tag trigger (see the `on:` block), so
    # the condition could not fire. Worse than dead -- it read as "releases are
    # covered" to anyone auditing the gate, which is exactly the belief that let
    # the installers stay broken from 2026-05-26 through 1.16.0.
    #
    # Release-time coverage lives in cd.yml after the exact tag's assets are
    # published. This on-demand bed instead exercises the latest published
    # release plus the stubbed-cosign failure paths below; both need a real
    # cosign binary before the hostile stub replaces it.
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install via install.sh (Unix)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --user --quiet
          "$HOME/.local/bin/skret" --version
      - name: Install via install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Quiet
          & "$env:LOCALAPPDATA\Programs\skret\skret.exe" --version
      # The signature check was worthless for months precisely because nothing
      # ever exercised its failure path -- it warned and installed anyway, and
      # no test could tell that apart from a passing check. Stub a cosign that
      # always fails, assert the installer now refuses, and assert the
      # documented escape hatch still gets through.
      - name: Installer refuses a bad signature (Unix)
        if: runner.os != 'Windows'
        run: |
          stub="$RUNNER_TEMP/stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "stub cosign: forced failure" >&2\nexit 1\n' > "$stub/cosign"
          chmod +x "$stub/cosign"
          export PATH="$stub:$PATH"
          rm -f "$HOME/.local/bin/skret"
          if ./install.sh --user --quiet; then
            echo "FAIL: install.sh installed despite a failing signature check"
            exit 1
          fi
          if [ -e "$HOME/.local/bin/skret" ]; then
            echo "FAIL: install.sh aborted but left a binary behind"
            exit 1
          fi
          SKRET_INSECURE_SKIP_VERIFY=1 ./install.sh --user --quiet
          "$HOME/.local/bin/skret" --version
      - name: Installer refuses a bad signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP "stub"
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          $bat = Join-Path $stub "cosign.bat"
          Set-Content -Path $bat -Value '@echo stub cosign: forced failure 1>&2'
          Add-Content -Path $bat -Value '@exit /b 1'
          $env:PATH = "$stub;$env:PATH"
          $exe = "$env:LOCALAPPDATA\Programs\skret\skret.exe"
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          # A child process, not dot-sourcing: install.ps1's Die calls exit, which
          # would end this step's own shell and mark it green.
          & pwsh -NoProfile -File .\install.ps1 -Quiet
          if ($LASTEXITCODE -eq 0) { throw "FAIL: install.ps1 installed despite a failing signature check" }
          if (Test-Path $exe) { throw "FAIL: install.ps1 aborted but left a binary behind" }
          $env:SKRET_INSECURE_SKIP_VERIFY = "1"
          & pwsh -NoProfile -File .\install.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { throw "FAIL: SKRET_INSECURE_SKIP_VERIFY did not allow the install" }
          & $exe --version
      # The homebrew tap ships a cask now, and casks have no `brew test`
      # equivalent - the formula's smoke assertion could not be migrated. This
      # leg covers the same ground automatically instead of on demand, and it
      # exercises the whole tap channel rather than just the binary.
      - name: Install via brew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install n24q02m/tap/skret
          skret --version
      - name: Install via scoop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            iwr -useb get.scoop.sh | iex
          }
          scoop bucket add n24q02m https://github.com/n24q02m/scoop-bucket
          scoop install skret
          skret --version

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  docs-build:
    name: Docs Astro build
    # PR gate mirroring the cd.yml docs artifact build so a breaking docs
    # dependency bump (e.g. @astrojs/starlight major needing a new astro) fails
    # at PR time instead of only on the manually dispatched prepare run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Sync install scripts into docs/public
        run: |
          cp install.sh docs/public/install.sh
          cp install.ps1 docs/public/install.ps1
      - name: Build Astro Starlight site
        working-directory: docs
        run: pnpm astro build

  hub:
    name: Vault hub Worker (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - name: Install
        working-directory: hub
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: hub
        run: pnpm test
      - name: Typecheck
        working-directory: hub
