name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

# Superseded pull-request runs are cancelled; main pushes always finish so every
# merge commit keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-bootstrap-verify:
    name: Verify README sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify README sync
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
      - name: Repo-bootstrap policy tests
        run: python -m unittest discover -s tests/repo_bootstrap -v

  pr-title:
    name: PR Title Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        shell: bash
        run: |
          # Captured, not piped into tee: the per-package figures below are read
          # from this output, and `go test | tee` would hand the step tee's exit
          # code, turning a failing suite green. GitHub's bash sets pipefail, but
          # this same script gets run by hand, where it does not.
          if ! go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... > internal-test.txt; then
            cat internal-test.txt
            exit 1
          fi
          cat internal-test.txt
          go test -race -coverprofile=coverage-pkg.out -covermode=atomic ./pkg/skret/...
      - name: Check internal coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Internal coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Internal coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
      # The 90% above is an average over ./internal/..., and an average hides a
      # single rotten package behind the healthy ones: internal/cli is large
      # enough that a small package could fall to 50% without moving the
      # aggregate off 90. This floor is per package, deliberately set below
      # today's worst (89.1%, internal/provider/local) so it catches a package
      # sliding rather than bikeshedding the packages that already pass.
      - name: Check per-package coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          below=$(awk -v floor=85 '
            /coverage:/ {
              c = ""
              for (i = 1; i <= NF; i++) if ($i == "coverage:") c = $(i + 1)
              if (c !~ /%$/) next          # "[no statements]" -- nothing to measure
              sub(/%$/, "", c)
              if (c + 0 < floor) printf "  %s  %s%%\n", $2, c
            }' internal-test.txt)
          if [ -n "$below" ]; then
            echo "These packages are below the 85% per-package floor:"
            echo "$below"
            exit 1
          fi
          echo "Every internal package is at or above the 85% floor."
      - name: Check pkg/skret coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage-pkg.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "pkg/skret coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
            echo "pkg/skret coverage ${COVERAGE}% is below 95% threshold"
            exit 1
          fi
      - name: Run E2E tests
        shell: bash
        run: go test -count=1 ./tests/e2e/... ./tests/agent-e2e/...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          file: ./coverage.out
          fail_ci_if_error: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY=skret
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=skret.exe
          fi
          go build -ldflags="-s -w -X github.com/n24q02m/skret/internal/version.Version=ci-${{ github.sha }}" -o $BINARY ./cmd/skret

  arm64-native:
    name: Native ARM64 OCI parity
    # Plan prescription (fleet-runtime-security plan, Task 7): exact-candidate
    # ARM64 jobs run in CI on a native arm64 runner. This job builds both OCI
    # archives natively (no qemu), verifies them with scripts/oci_arm64_harness.py
    # verify_inputs, and smokes the CLI binary and the sync plan-server inside
    # real arm64 containers.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # The default docker driver cannot export OCI archives; the
      # docker-container driver (same pin as cd.yml) can.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/arm64 CLI natively
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p context/linux/arm64
          go build -trimpath \
            -ldflags="-s -w -X github.com/n24q02m/skret/internal/version.Version=ci-${GITHUB_SHA::7}" \
            -o context/linux/arm64/skret ./cmd/skret
      # The CLI Dockerfile pins a single-arch (amd64) base manifest digest for
      # the amd64 release lane. This job rewrites it to the equivalent
      # linux/arm64 manifest digest (resolved from the same tag) so every
      # RUN step executes natively on the arm64 runner. CI-ephemeral only;
      # the checked-in Dockerfile is untouched on disk in git.
      - name: Build CLI OCI archive (native arm64)
        run: |
          set -euo pipefail
          cp Dockerfile context/Dockerfile
          sed -i 's|alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f|alpine@sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c|' context/Dockerfile
          grep -q 'sha256:d858bb5442632a31bd4bca6c5e601dbe6b536fd7942092ea6a08a0a95805693c' context/Dockerfile
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile context \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=0.0.0-ci-${GITHUB_SHA::7}" \
            --provenance=false --sbom=false \
            --output type=oci,dest=skret-cli.oci.tar
      - name: Build sync OCI archive (native arm64)
        run: |
          set -euo pipefail
          cp Dockerfile.sync context/Dockerfile.sync
          mkdir -p context/deploy
          cp deploy/sync-entrypoint.sh context/deploy/sync-entrypoint.sh
          # Dockerfile.sync pins the multi-arch index digest, so
          # --platform linux/arm64 selects the arm64 child natively and no
          # rewrite is needed (a hard-coded rewrite broke on every Renovate
          # digest bump).
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile.sync context \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=0.0.0-ci-${GITHUB_SHA::7}" \
            --provenance=false --sbom=false \
            --output type=oci,dest=skret-sync.oci.tar
      - name: Smoke CLI inside a native arm64 container
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile context \
            --provenance=false --sbom=false \
            --load --tag skret-ci:cli
          out="$(docker run --rm skret-ci:cli --version)"
          echo "cli version: $out"
          case "$out" in
            *"ci-${GITHUB_SHA::7}"*) ;;
            *) echo "cli version mismatch" >&2; exit 1 ;;
          esac
      - name: Smoke sync plan-server inside a native arm64 container
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file context/Dockerfile.sync context \
            --provenance=false --sbom=false \
            --load --tag skret-ci:sync
          cid="$(docker run -d -p 18080:8080 skret-ci:sync)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              echo "plan-server healthz ok"
              exit 0
            fi
            sleep 1
          done
          echo "plan-server healthz failed" >&2
          exit 1
      - name: Verify both archives with the ARM64 harness
        run: |
          set -euo pipefail
          printf '{"schema":"offline-fixture"}\n' > launch-manifest.json
          printf 'live-a\n' > live-a
          printf 'live-b\n' > live-b
          dig() { printf 'sha256:%s' "$(sha256sum "$1" | cut -d' ' -f1)"; }
          jq -nc \
            --arg schema "skret-oci-arm64-harness/v1" \
            --arg candidate_version "0.0.0-ci-${GITHUB_SHA::7}" \
            --arg source_sha "$GITHUB_SHA" \
            --arg cli_archive "$PWD/skret-cli.oci.tar" \
            --arg cli_archive_digest "$(dig skret-cli.oci.tar)" \
            --arg sync_archive "$PWD/skret-sync.oci.tar" \
            --arg sync_archive_digest "$(dig skret-sync.oci.tar)" \
            --arg launch_manifest "$PWD/launch-manifest.json" \
            --arg launch_manifest_digest "$(dig launch-manifest.json)" \
            --arg live_a "$PWD/live-a" \
            --arg live_b "$PWD/live-b" \
            '{
              schema: $schema,
              candidate_version: $candidate_version,
              source_sha: $source_sha,
              cli_archive: $cli_archive,
              cli_archive_digest: $cli_archive_digest,
              cli_entrypoint: ["/usr/local/bin/skret"],
              sync_archive: $sync_archive,
              sync_archive_digest: $sync_archive_digest,
              sync_entrypoint: ["/usr/local/bin/sync-entrypoint.sh"],
              launch_manifest: $launch_manifest,
              launch_manifest_digest: $launch_manifest_digest,
              live_paths: ([$live_a, $live_b] | sort),
              platform: "linux/arm64"
            }' | python3 -c "import json,sys;sys.stdout.write(json.dumps(json.load(sys.stdin),sort_keys=True,separators=(',',':')))" > spec.json
          python3 scripts/oci_arm64_harness.py --spec "$PWD/spec.json" || {
            status=$?
            echo "--- harness failed; spec diagnostics ---" >&2
            cat spec.json >&2
            exit $status
          }

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # GitHub default setup owns SARIF upload for this repository. The
          # pinned advanced job still builds and analyzes locally, but must not
          # submit a second CodeQL configuration.
          upload: never


  installer-lint:
    name: Installer scripts lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: "."
          additional_files: "install.sh"
          severity: warning
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning -EnableExit

  installer-smoke:
    name: Installer smoke test (${{ matrix.os }})
    # Gate behind workflow_dispatch for PRs: the scripts hit the live GitHub API
    # for the latest release tag, and we do not want a PR's CI to block on external
    # reachability or hit rate limits on every push.
    #
    # This used to also read `|| startsWith(github.ref, 'refs/tags/v')`, which was
    # never once true: this workflow has no tag trigger (see the `on:` block), so
    # the condition could not fire. Worse than dead -- it read as "releases are
    # covered" to anyone auditing the gate, which is exactly the belief that let
    # the installers stay broken from 2026-05-26 through 1.16.0.
    #
    # Release-time coverage lives in cd.yml after the exact tag's assets are
    # published. This on-demand bed instead exercises the latest published
    # release plus the stubbed-cosign failure paths below; both need a real
    # cosign binary before the hostile stub replaces it.
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify Cosign version
        shell: bash
        run: |
          set -euo pipefail
          cosign version --json |
            python scripts/repo-bootstrap/verify_cosign_version.py v3.0.6
      - name: Install via install.sh (Unix)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --user --quiet
          "$HOME/.local/bin/skret" --version
      - name: Install via install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Quiet
          & "$env:LOCALAPPDATA\Programs\skret\skret.exe" --version
      # The signature check was worthless for months precisely because nothing
      # ever exercised its failure path -- it warned and installed anyway, and
      # no test could tell that apart from a passing check. Stub a cosign that
      # always fails, assert the installer now refuses, and assert the
      # documented escape hatch still gets through.
      - name: Installer refuses a bad signature (Unix)
        if: runner.os != 'Windows'
        run: |
          stub="$RUNNER_TEMP/stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "stub cosign: forced failure" >&2\nexit 1\n' > "$stub/cosign"
          chmod +x "$stub/cosign"
          export PATH="$stub:$PATH"
          rm -f "$HOME/.local/bin/skret"
          if ./install.sh --user --quiet; then
            echo "FAIL: install.sh installed despite a failing signature check"
            exit 1
          fi
          if [ -e "$HOME/.local/bin/skret" ]; then
            echo "FAIL: install.sh aborted but left a binary behind"
            exit 1
          fi
          SKRET_INSECURE_SKIP_VERIFY=1 ./install.sh --user --quiet
          "$HOME/.local/bin/skret" --version
      - name: Installer refuses a bad signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP "stub"
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          $bat = Join-Path $stub "cosign.bat"
          Set-Content -Path $bat -Value '@echo stub cosign: forced failure 1>&2'
          Add-Content -Path $bat -Value '@exit /b 1'
          $env:PATH = "$stub;$env:PATH"
          $exe = "$env:LOCALAPPDATA\Programs\skret\skret.exe"
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          # A child process, not dot-sourcing: install.ps1's Die calls exit, which
          # would end this step's own shell and mark it green.
          & pwsh -NoProfile -File .\install.ps1 -Quiet
          if ($LASTEXITCODE -eq 0) { throw "FAIL: install.ps1 installed despite a failing signature check" }
          if (Test-Path $exe) { throw "FAIL: install.ps1 aborted but left a binary behind" }
          $env:SKRET_INSECURE_SKIP_VERIFY = "1"
          & pwsh -NoProfile -File .\install.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { throw "FAIL: SKRET_INSECURE_SKIP_VERIFY did not allow the install" }
          & $exe --version
      # The homebrew tap ships a cask now, and casks have no `brew test`
      # equivalent - the formula's smoke assertion could not be migrated. This
      # leg covers the same ground automatically instead of on demand, and it
      # exercises the whole tap channel rather than just the binary.
      - name: Install via brew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install n24q02m/tap/skret
          skret --version
      - name: Install via scoop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            iwr -useb get.scoop.sh | iex
          }
          scoop bucket add n24q02m https://github.com/n24q02m/scoop-bucket
          scoop install skret
          skret --version

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  docs-build:
    name: Docs Astro build
    # PR gate mirroring the cd.yml docs artifact build so a breaking docs
    # dependency bump (e.g. @astrojs/starlight major needing a new astro) fails
    # at PR time instead of only on the manually dispatched prepare run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno --version
      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Stack gates (biome + oxlint + oxfmt)
        working-directory: docs
        run: |
          bun run check
          bun run lint:ox
      - name: Sync install scripts into docs/public
        run: |
          cp install.sh docs/public/install.sh
          cp install.ps1 docs/public/install.ps1
      - name: Build Astro Starlight site
        working-directory: docs
        run: bun run build

  hub:
    name: Vault hub Worker (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno --version
      - name: Install
        working-directory: hub
        run: bun install --frozen-lockfile
      - name: Stack gates (biome + oxlint + oxfmt)
        working-directory: hub
        run: |
          bun run check
          bun run lint:ox
      - name: Test
        working-directory: hub
        run: bun run test
      - name: Typecheck
        working-directory: hub
        run: bun run typecheck
      - name: Build check
        working-directory: hub
        run: bun run dryrun

  # ==========================================================================
  # Composite action e2e (merged from action-e2e.yml)
  # Exercises the composite action in this repo (uses: ./) on the three hosted
  # OSes: install from real GitHub releases with checksum verification, then the
  # run/scan/diff wiring against a local-provider fixture repo created in
  # RUNNER_TEMP (no cloud creds, and the skret checkout itself is never the scan
  # target: the fixture value literals in this file must stay out of scan's
  # tracked-file set).
  # ==========================================================================
  action-e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install via the action (install-only mode)
        id: install
        uses: ./
        with:
          command: ''

      - name: Assert install outputs and binary version
        env:
          RESOLVED: ${{ steps.install.outputs.version }}
        shell: bash
        run: |
          case "$RESOLVED" in
            [0-9]*.[0-9]*.[0-9]*) echo "resolved version: $RESOLVED" ;;
            *) echo "bad version output: '$RESOLVED'" >&2; exit 1 ;;
          esac
          "$SKRET_BIN" --version | grep -F "$RESOLVED" || {
            echo "binary version does not match resolved output '$RESOLVED'" >&2
            exit 1
          }

      - name: Create isolated fixture repository
        id: fixture
        env:
          SKRET_NON_INTERACTIVE: '1'
        shell: bash
        run: |
          dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skret-e2e-fixture"
          rm -rf "$dir"
          mkdir -p "$dir"
          cd "$dir"
          git init -q .
          cat > .skret.yaml <<'YAML'
          version: "1"
          default_env: dev
          project: action-e2e

          environments:
            dev:
              provider: local
              file: .secrets.dev.yaml
            stage:
              provider: local
              file: .secrets.stage.yaml
          YAML
          printf 'secrets: {}\n' > .secrets.dev.yaml
          printf 'secrets: {}\n' > .secrets.stage.yaml
          git add .skret.yaml
          "$SKRET_BIN" set FIXTURE_TOKEN 'e2e-fixture-value-7f3a9c' --env dev
          "$SKRET_BIN" set ONLY_STAGE_TOKEN 'stage-only-11' --env stage
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "$dir")"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: 'run injects secrets into the child process'
        uses: ./
        with:
          command: run
          workdir: ${{ steps.fixture.outputs.dir }}
          args: -- printenv FIXTURE_TOKEN

      - name: 'run propagates child failure (expects failure)'
        id: run_fail
        continue-on-error: true
        uses: ./
        with:
          command: run
          workdir: ${{ steps.fixture.outputs.dir }}
          args: -- false

      - name: Assert child failure propagated
        if: steps.run_fail.outcome != 'failure'
        shell: bash
        run: |
          echo "skret run -- false must fail the step" >&2
          exit 1

      - name: 'scan passes on a clean fixture tree'
        uses: ./
        with:
          command: scan
          workdir: ${{ steps.fixture.outputs.dir }}

      - name: Plant a leak in the fixture repo
        env:
          DIR: ${{ steps.fixture.outputs.dir }}
        shell: bash
        run: |
          printf 'leak: e2e-fixture-value-7f3a9c\n' > "$DIR/leaked.txt"
          git -C "$DIR" add leaked.txt

      - name: 'scan fails on a leak (expects failure)'
        id: scan_leak
        continue-on-error: true
        uses: ./
        with:
          command: scan
          workdir: ${{ steps.fixture.outputs.dir }}

      - name: Assert leak scan failed the step
        if: steps.scan_leak.outcome != 'failure'
        shell: bash
        run: |
          echo "skret scan must fail the step when a value leaked (exit 10)" >&2
          exit 1

  action-e2e-contract:
    name: e2e (action contract, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install via the action
        id: install
        uses: ./
        with:
          command: ''

      - name: Create isolated fixture repository
        id: fixture
        env:
          SKRET_NON_INTERACTIVE: '1'
        shell: bash
        run: |
          dir="${RUNNER_TEMP:-/tmp}/skret-e2e-fixture"
          rm -rf "$dir"
          mkdir -p "$dir"
          cd "$dir"
          git init -q .
          cat > .skret.yaml <<'YAML'
          version: "1"
          default_env: dev
          project: action-e2e

          environments:
            dev:
              provider: local
              file: .secrets.dev.yaml
            stage:
              provider: local
              file: .secrets.stage.yaml
          YAML
          printf 'secrets: {}\n' > .secrets.dev.yaml
          printf 'secrets: {}\n' > .secrets.stage.yaml
          git add .skret.yaml
          "$SKRET_BIN" set FIXTURE_TOKEN 'e2e-fixture-value-7f3a9c' --env dev
          "$SKRET_BIN" set ONLY_STAGE_TOKEN 'stage-only-11' --env stage
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: 'env input reaches the skret process'
        uses: ./
        with:
          command: run
          workdir: ${{ steps.fixture.outputs.dir }}
          env: |
            # comment lines are ignored
            SKRET_ACTION_E2E_A=alpha-42
          args: -- printenv SKRET_ACTION_E2E_A

      - name: 'config input wires --config'
        env:
          DIR: ${{ steps.fixture.outputs.dir }}
          SKRET_NON_INTERACTIVE: '1'
        shell: bash
        run: |
          cd "$DIR"
          sed 's/\.secrets\.dev\.yaml/.secrets.alt.yaml/' .skret.yaml > alt.yaml
          printf 'secrets: {}\n' > .secrets.alt.yaml
          "$SKRET_BIN" set ALT_TOKEN 'alt-value-99' --config alt.yaml --env dev

      - name: 'run with config input finds the alt environment'
        uses: ./
        with:
          command: run
          workdir: ${{ steps.fixture.outputs.dir }}
          config: alt.yaml
          args: -- printenv ALT_TOKEN

      - name: Assert exact exit codes and JSON envelope
        env:
          DIR: ${{ steps.fixture.outputs.dir }}
        shell: bash
        run: |
          # GitHub injects -e into shell: bash; these assertions deliberately
          # run commands that exit non-zero, so error handling is manual.
          set +e
          set -u
          fail() { echo "contract: $*" >&2; exit 1; }

          cd "$DIR" || fail "fixture dir missing: $DIR"

          printf 'leak: e2e-fixture-value-7f3a9c\n' > leaked.txt
          git add leaked.txt

          "$SKRET_BIN" scan >/dev/null 2>&1
          code=$?
          [ "$code" -eq 10 ] || fail "scan leak exit: want 10, got $code"

          "$SKRET_BIN" scan --format json >scan-stdout.txt 2>scan-stderr.txt
          code=$?
          [ "$code" -eq 10 ] || fail "scan leak --format json exit: want 10, got $code"
          jq -e '.code == 10 and (.error | length > 0)' scan-stderr.txt >/dev/null \
            || fail "scan --format json stderr is not the documented error envelope: $(cat scan-stderr.txt)"

          "$SKRET_BIN" diff dev stage --exit-code >/dev/null 2>&1
          code=$?
          [ "$code" -eq 9 ] || fail "diff drift exit: want 9, got $code"

          echo "exit-code contract verified (10, 9) + JSON envelope"

      - name: 'pinned version input installs exactly that release'
        id: pinned
        uses: ./
        with:
          command: ''
          version: v1.19.3

      - name: Assert pinned version output
        env:
          RESOLVED: ${{ steps.pinned.outputs.version }}
        shell: bash
        run: |
          [ "$RESOLVED" = "1.19.3" ] || { echo "want 1.19.3, got '$RESOLVED'" >&2; exit 1; }
          "$SKRET_BIN" --version | grep -F "1.19.3"
          echo "pinned install verified"

  # ==========================================================================
  # Agent contract harness (merged from agent-e2e.yml)
  # tests/agent-e2e drives the built skret binary the way an unattended agent
  # would and fails on any deviation from the documented contract (exit codes,
  # JSON error envelope, byte-exact stdout, non-interactive behavior with no
  # TTY). Local provider only, no LLM or cloud credentials; an LLM-driven
  # variant must be gated behind `if: vars.AGENT_E2E_LLM == 'true'`.
  # ==========================================================================
  agent-e2e:
    name: Agent contract harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the minimum bar (and the platform agents run on most);
        # macOS shares the unix exec semantics. Windows joins via the same
        # harness in ci.yml's test matrix, with the platform-documented
        # run-exit-code difference asserted rather than skipped.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Agent contract harness
        shell: bash
        run: go test -count=1 -v ./tests/agent-e2e/...
