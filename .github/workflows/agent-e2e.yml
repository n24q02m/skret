name: Agent e2e

# The agent-contract harness (tests/agent-e2e): a scripted agent session that
# drives the built skret binary exactly the way an unattended agent would and
# fails on any deviation from the documented contract — exit codes, the JSON
# error envelope, byte-exact stdout, stdout=data/stderr=status, and
# non-interactive behavior with no TTY. See docs/guide/agents.md
# ("The agent e2e guarantee").
#
# Always-on by design: the harness exercises the local provider only and wires
# no LLM or cloud credentials. If an LLM-driven variant is ever added, gate
# THAT behind `if: vars.AGENT_E2E_LLM == 'true'`; this job must stay keyless.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: agent-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Agent contract harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the minimum bar (and the platform agents run on most);
        # macOS shares the unix exec semantics. Windows joins via the same
        # harness in ci.yml's test matrix, with the platform-documented
        # run-exit-code difference asserted rather than skipped.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Agent contract harness
        shell: bash
        run: go test -count=1 -v ./tests/agent-e2e/...
