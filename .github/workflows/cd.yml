name: CD

# CD handles:
#  - Release on workflow_dispatch (semantic-release -> tag -> goreleaser -> publish)
#  - Docs deploy on push to main when docs/** changes (Cloudflare Pages)
#  - Vault hub Worker deploy on push to main when hub/** changes (Cloudflare Workers)
#  - Optional sync-secrets job that pulls /skret/ci/* from AWS SSM and pushes
#    them to GitHub Actions repository secrets (opt-in via vars.SYNC_SECRETS_ENABLED)
#
# Repo Secrets required:
#   GITHUB_TOKEN             - built-in
#   AWS_ROLE_ARN             - OIDC role with read on /skret/ci/* in SSM
#   CI_APP_KEY               - n24q02m-ci GitHub App private key (for skret sync to push GH Actions secrets)
#   CLOUDFLARE_API_TOKEN     - CF Pages deploy
#   CLOUDFLARE_ACCOUNT_ID    - CF account ID (also used by the vault hub deploy)
#   TAP_GITHUB_TOKEN         - fine-grained PAT for tap repo updates
#   HUB_CF_DEPLOY_TOKEN      - project-scoped CF token for the vault hub Worker (account Workers Scripts + KV write only; custom domain attached out-of-band, no zone perm); also used to push the sync container image to the Cloudflare managed registry -- verify it covers that scope, may need a Containers/Images permission added
#   VAULT_KV_ID              - KV namespace id for the vault hub (from `wrangler kv namespace create VAULT_KV`)
#
# Repo Variables required:
#   CI_APP_ID                - n24q02m-ci GitHub App ID (3200052)
#   SYNC_SECRETS_ENABLED     - set to "true" to enable the SSM->GH-Actions sync job

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "hub/**"
      - "Dockerfile.sync"
      - "deploy/**"
      - ".github/workflows/cd.yml"
  # Deliberately NO `tags: ["v*"]`. semantic-release pushes the tag with an App
  # token, so a tag trigger fires a SECOND CD run for every release we dispatch
  # -- and both runs built and uploaded the same tag concurrently. On
  # v1.17.1-beta.1 the two goreleaser jobs started 4 seconds apart and the
  # release ended up carrying two archives from one build, four from the other,
  # and a checksums.txt describing only the second. Every installer verifies
  # checksums and is fail-closed, so that release was uninstallable.
  #
  # `concurrency` below cannot catch this: it keys on github.ref, which is
  # refs/heads/main for the dispatch run and refs/tags/<v> for the tag run --
  # two different groups, hence no serialization at the one collision that
  # matters. Publishing is therefore owned by exactly one event: this dispatch.
  #
  # Hand-pushing a tag no longer publishes anything. That flow was already
  # against policy (versions come from semantic-release; we never pick one by
  # hand), and it was the entry point for this corruption.
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-readme-sync:
    name: Verify README sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify README sync
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ==================== Release (workflow_dispatch) ====================
  release:
    name: Semantic Release
    if: github.event_name == 'workflow_dispatch'
    needs: [verify-readme-sync]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.release_type == 'beta' && 'beta-publish' || 'stable-publish' }}
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: release
        uses: n24q02m/better-semantic-release@087b84e8d2ba75bdec350924d3bf8247088e0b1a # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ github.event.inputs.release_type == 'beta' }}
          prerelease_token: beta
      - if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  # ==================== Goreleaser ====================
  # The one and only publisher of a tag's artifacts. See the `on:` block for
  # why the second entry point was removed.
  goreleaser:
    name: Build and Publish Binaries
    # No `always()` any more. It existed solely so this job would survive
    # `release` being skipped on the tag-push path; with that path gone,
    # `release` runs in every scenario where this job could, and the default
    # needs-semantics (run only if all dependencies succeeded) is precisely the
    # intent. `always()` here was actively harmful: combined with a `result ==
    # 'success'` check on only ONE of the two dependencies, it let this job
    # start while the other had failed.
    if: needs.release.outputs.released == 'true'
    needs: [release, verify-readme-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both are required by the dockers_v2 block in .goreleaser.yaml, which
      # builds a linux/amd64 + linux/arm64 manifest. The runner's default
      # buildx driver is `docker`, which refuses multi-platform builds, and the
      # image's `RUN apk add ca-certificates` executes in the target
      # architecture, so the arm64 leg needs binfmt emulation to run at all.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin goreleaser to the exact tag semantic-release produced.
          # Without this, git-describe is ambiguous when a stable tag and
          # a prerelease tag (e.g. v1.5.1 + v1.5.1-beta.1) point at the same
          # commit, and goreleaser may pick the wrong one (duplicate-asset 422).
          GORELEASER_CURRENT_TAG: ${{ needs.release.outputs.tag }}
          # Fine-grained PAT with `contents:write` on
          # n24q02m/homebrew-tap + n24q02m/scoop-bucket. Goreleaser
          # uses this to push formula/manifest updates on release.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # ==================== Installer smoke (post-publish) ====================
  # The installers can only be exercised against a release that already exists,
  # which is why this cannot live on the tag-push event the way ci.yml's copy
  # tried to: semantic-release creates the tag, and goreleaser only uploads the
  # assets afterwards. A smoke test wired to the tag would download files that
  # do not exist yet and fail every release for the wrong reason.
  #
  # ci.yml keeps a `workflow_dispatch` copy as the on-demand bed (and owns the
  # stubbed-cosign failure-path assertions, which need no real release). This
  # job is the one that fires on every release -- the gate that was missing
  # while the installers stayed broken from 2026-05-26 through 1.16.0.
  installer-smoke:
    name: Installer smoke test (${{ matrix.os }})
    # No `if:` at all -- default needs-semantics already means "only when both
    # dependencies succeeded", which is the whole requirement. The `always()`
    # this used to carry was inherited from goreleaser's tag-push workaround.
    needs: [release, goreleaser]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The exact tag just published. The scripts can detect a version on their
      # own, but that path must not be used here: they ask the GitHub API for
      # the *latest* release, and on a beta run that is the previous STABLE. The
      # job would install a release this run never produced and report green.
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install via install.sh (Unix)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --user --quiet "--version=$TAG"
          got=$("$HOME/.local/bin/skret" --version)
          echo "$got"
          # Asserting the version, not just a zero exit: an installer that
          # silently falls back to an older release still exits 0. Anchored on
          # `version <v> (` rather than a bare substring, because 1.17.0 is a
          # substring of 1.17.0-beta.1 and a loose match would accept a
          # prerelease as its own stable.
          case "$got" in
            *"version ${TAG#v} ("*) ;;
            *) echo "FAIL: installed '$got', expected $TAG"; exit 1 ;;
          esac
      - name: Install via install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Quiet -Version $env:TAG
          $got = & "$env:LOCALAPPDATA\Programs\skret\skret.exe" --version
          Write-Host $got
          # Same anchoring as the Unix leg: a bare substring would let
          # 1.17.0-beta.1 satisfy an assertion for 1.17.0.
          $want = "version " + $env:TAG.TrimStart('v') + " ("
          if ($got -notlike "*$want*") { throw "FAIL: installed '$got', expected $env:TAG" }
      # The tap and the bucket are part of a release too, and they break on
      # their own terms -- #649 was a cask that named a shell homebrew does not
      # support, invisible from the archive path. Stable only: a prerelease
      # carries skip_upload for both, so on a beta these would install the
      # previous stable and assert nothing about this run.
      - name: Install via brew (macOS, stable only)
        if: runner.os == 'macOS' && !contains(env.TAG, '-')
        run: |
          brew install n24q02m/tap/skret
          skret --version
      - name: Install via scoop (Windows, stable only)
        if: runner.os == 'Windows' && !contains(env.TAG, '-')
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            iwr -useb get.scoop.sh | iex
          }
          scoop bucket add n24q02m https://github.com/n24q02m/scoop-bucket
          scoop install skret
          skret --version

  # ==================== Sync Secrets (opt-in) ====================
  # Pulls /skret/ci/* from AWS SSM and pushes the values into this repo's
  # GitHub Actions secrets. Opt-in via vars.SYNC_SECRETS_ENABLED.
  #
  # Uses an n24q02m-ci App token (consistent with the rest of the n24q02m
  # repos). Requires `Secrets: Read & write` granted on the App and accepted
  # on the skret installation.
  sync-secrets:
    name: Sync Secrets from AWS SSM
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      vars.SYNC_SECRETS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build skret
        run: go build -o skret ./cmd/skret
      - name: Write minimal .skret.yaml for CI invocation
        run: |
          cat > .skret.yaml <<EOF
          version: "1"
          default_env: prod
          environments:
            prod:
              provider: aws
              path: /skret/ci
              region: ap-southeast-1
          EOF
      - name: Sync secrets to GitHub
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./skret sync --to=github \
            --github-repo=${{ github.repository }} \
            -e prod

  # ==================== Docs Deploy ====================
  docs:
    name: Deploy Docs to Cloudflare Pages
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # No `deployments: write`. It arrived with a pnpm bump in #273 rather than
    # with any code that needed it, and nothing in this job touches the GitHub
    # Deployments API -- the publish step is cloudflare/wrangler-action, which
    # talks to Cloudflare.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Sync install scripts into docs/public
        run: |
          cp install.sh docs/public/install.sh
          cp install.ps1 docs/public/install.ps1
      - name: Build Astro Starlight site
        working-directory: docs
        run: pnpm astro build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=skret --branch=main

  # ==================== Vault Hub Deploy ====================
  deploy-hub:
    name: Deploy Vault Hub Worker
    # workflow_dispatch (any release_type) also redeploys the hub even when
    # only CLI code changed -- intentional: the hub isn't versioned with the
    # CLI, and a redeploy of the same Worker source is idempotent/harmless.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - name: Install
        working-directory: hub
        run: pnpm install --frozen-lockfile
      # Fail-safe deploy gate: never publish a build that fails tests or types.
      # cd.yml and ci.yml are independent workflows with no cross-ordering, so
      # the gate is repeated here rather than relying on the CI hub job landing.
      - name: Test
        working-directory: hub
        run: pnpm test
      - name: Typecheck
        working-directory: hub
        run: pnpm typecheck
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Compute sync container image tag
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "SKRET_SYNC_IMAGE=registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/skret-sync:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build sync container image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --file Dockerfile.sync \
            --tag "$SKRET_SYNC_IMAGE" \
            .
      # Pushes to the Cloudflare managed registry (registry.cloudflare.com),
      # not a standard docker registry -- auth is via CLOUDFLARE_API_TOKEN /
      # CLOUDFLARE_ACCOUNT_ID env vars, which Wrangler reads directly.
      - name: Push sync container image
        working-directory: hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.HUB_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler containers push "$SKRET_SYNC_IMAGE"
      - name: Render deploy config from secrets
        working-directory: hub
        env:
          VAULT_KV_ID: ${{ secrets.VAULT_KV_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          envsubst '${VAULT_KV_ID} ${SKRET_SYNC_IMAGE} ${CLOUDFLARE_ACCOUNT_ID}' \
            < wrangler.deploy.template.jsonc > wrangler.deploy.jsonc
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.HUB_CF_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: hub
          command: deploy --config wrangler.deploy.jsonc
