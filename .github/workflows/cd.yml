name: CD

# The read-only prepare lane builds one local release commit/tag, immutable
# artifacts, and an exact Git bundle. The protected publish lane verifies that
# handoff, atomically advances the remote refs, and delegates create-once asset
# publication to the signed BSR G1 publisher. No deploy job exists here.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Candidate channel"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: read

concurrency:
  group: skret-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      transaction_id: ${{ steps.journal.outputs.transaction_id }}
      artifact_digest: ${{ steps.journal.outputs.artifact_digest }}
      intent_digest: ${{ steps.journal.outputs.intent_digest }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      git_bundle_digest: ${{ steps.git-bundle.outputs.git_bundle_digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The signed G1 version action creates the release commit and tag only in
      # this read-only checkout. Push, release creation, and asset publication
      # remain impossible in the prepare job.
      - id: release
        name: Prepare local release commit and tag
        uses: n24q02m/better-semantic-release@096ba88af5df375b958212a9fbc6b80ab66888d7 # v1.6.0-beta.8 G1 generation 3
        with:
          github_token: ${{ github.token }}
          config_file: semantic-release.toml
          commit: true
          tag: true
          push: false
          vcs_release: false
          build: false
          prerelease: ${{ inputs.release_type == 'beta' }}
          prerelease_token: beta
          git_committer_name: n24q02m-ci
          git_committer_email: 3200052+n24q02m-ci@users.noreply.github.com

      - id: version
        name: Bind prepared release identity
        shell: bash
        env:
          BSR_RELEASED: ${{ steps.release.outputs.released }}
          BSR_VERSION: ${{ steps.release.outputs.version }}
          BSR_TAG: ${{ steps.release.outputs.tag }}
          BASE_SOURCE_SHA: ${{ github.sha }}
          CHANNEL_INPUT: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          test "$BSR_RELEASED" = "true"
          test -n "$BSR_VERSION"
          test -n "$BSR_TAG"
          release_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "${release_commit}^")" = "$BASE_SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$BSR_TAG^{commit}")" = "$release_commit"
          {
            printf 'version=%s\n' "$BSR_VERSION"
            printf 'tag=%s\n' "$BSR_TAG"
            printf 'release_commit=%s\n' "$release_commit"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'BASE_SOURCE_SHA=%s\n' "$BASE_SOURCE_SHA"
            printf 'SOURCE_SHA=%s\n' "$release_commit"
            printf 'CHANNEL=%s\n' "$CHANNEL_INPUT"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set reproducible build epoch
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"



      - name: Prepare CLI archives, checksums, and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish -f .goreleaser.prepare.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
      - name: Build CLI OCI archive from prepared binaries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t amd64_archives < <(
            find dist -maxdepth 1 -type f -name 'skret_*_linux_amd64.tar.gz' -print0
          )
          mapfile -d '' -t arm64_archives < <(
            find dist -maxdepth 1 -type f -name 'skret_*_linux_arm64.tar.gz' -print0
          )
          test "${#amd64_archives[@]}" -eq 1
          test "${#arm64_archives[@]}" -eq 1
          amd64_archive="${amd64_archives[0]}"
          arm64_archive="${arm64_archives[0]}"
          context="$RUNNER_TEMP/cli-image"
          rm -rf "$context"
          mkdir -p "$context/linux/amd64" "$context/linux/arm64"
          cp Dockerfile "$context/Dockerfile"
          tar -xOf "$amd64_archive" skret > "$context/linux/amd64/skret"
          tar -xOf "$arm64_archive" skret > "$context/linux/arm64/skret"
          chmod 0755 "$context/linux/amd64/skret" "$context/linux/arm64/skret"
          docker buildx build \
            --file "$context/Dockerfile" \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --provenance=false \
            --sbom=false \
            --output type=oci,dest=dist/skret-cli.oci.tar \
            "$context"


      - name: Build sync OCI archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker buildx build \
            --file Dockerfile.sync \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --provenance=false \
            --sbom=false \
            --output type=oci,dest=dist/skret-sync.oci.tar \
            .
      - name: Generate source manifest
        shell: bash
        env:
          MANIFEST_SOURCE_SHA: ${{ github.sha }}
          MANIFEST_VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_TAG: ${{ steps.release.outputs.tag }}
          MANIFEST_CHANNEL: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          python scripts/release_manifests.py source \
            --root . \
            --output dist/source-manifest.json \
            --digest-output dist/source-manifest.sha256 \
            --source-sha "$MANIFEST_SOURCE_SHA" \
            --version "$MANIFEST_VERSION" \
            --tag "$MANIFEST_TAG" \
            --channel "$MANIFEST_CHANNEL" \
            --exclude .git \
            --exclude dist \
            --exclude docs/dist \
            --exclude hub/node_modules \
            --exclude docs/node_modules

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            hub/pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install Hub dependencies
        working-directory: hub
        run: pnpm install --frozen-lockfile
      - name: Verify Hub sources
        working-directory: hub
        run: |
          pnpm test
          pnpm typecheck

      - name: Build ordinary Hub bundle
        working-directory: hub
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hub-bundle"
          pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/hub-bundle"

      - name: Build security executor bundle
        working-directory: hub
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/security-executor-bundle"
          pnpm exec wrangler deploy --dry-run --config wrangler.executor.jsonc --outdir "$RUNNER_TEMP/security-executor-bundle"

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs bundle
        shell: bash
        env:
          MANIFEST_SOURCE_SHA: ${{ github.sha }}
          MANIFEST_VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_TAG: ${{ steps.release.outputs.tag }}
          MANIFEST_CHANNEL: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          cp install.sh docs/public/install.sh
          cp install.ps1 docs/public/install.ps1
          pnpm --dir docs astro build
          mkdir -p docs/dist/.well-known
          source_manifest_digest="sha256:$(tr -d '\r\n' < dist/source-manifest.sha256)"
          python scripts/release_manifests.py deployment \
            --root docs/dist \
            --output docs/dist/.well-known/skret-deployment-manifest.json \
            --digest-output dist/deployment-manifest.sha256 \
            --source-sha "$MANIFEST_SOURCE_SHA" \
            --version "$MANIFEST_VERSION" \
            --tag "$MANIFEST_TAG" \
            --channel "$MANIFEST_CHANNEL" \
            --source-manifest-digest "$source_manifest_digest" \
            --manifest-path .well-known/skret-deployment-manifest.json \
            --signature-path .well-known/skret-deployment-manifest.sig
          rm -f dist/hub.bundle.tar dist/security-executor.bundle.tar dist/docs.bundle.tar
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf dist/hub.bundle.tar -C "$RUNNER_TEMP/hub-bundle" .
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf dist/security-executor.bundle.tar -C "$RUNNER_TEMP/security-executor-bundle" .
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf dist/docs.bundle.tar -C docs/dist .
      - name: Generate auxiliary SBOMs
        shell: bash
        run: |
          set -euo pipefail
          syft "oci-archive:dist/skret-cli.oci.tar" -o "spdx-json=dist/cli-oci.sbom.json"
          syft "oci-archive:dist/skret-sync.oci.tar" -o "spdx-json=dist/sync-oci.sbom.json"
          syft "dir:$RUNNER_TEMP/hub-bundle" -o "spdx-json=dist/hub.sbom.json"
          syft "dir:$RUNNER_TEMP/security-executor-bundle" -o "spdx-json=dist/security-executor.sbom.json"
          syft "dir:docs/dist" -o "spdx-json=dist/docs.sbom.json"

      - name: Generate artifact manifest
        shell: bash
        env:
          MANIFEST_SOURCE_SHA: ${{ github.sha }}
          MANIFEST_VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_TAG: ${{ steps.release.outputs.tag }}
          MANIFEST_CHANNEL: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f \
            ! -name 'auxiliary-checksums.txt' \
            ! -name 'source-manifest.json' \
            ! -name 'source-manifest.sha256' \
            ! -name 'artifact-manifest.json' \
            ! -name 'artifact-manifest.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > dist/auxiliary-checksums.txt
          source_manifest_digest="sha256:$(tr -d '\r\n' < dist/source-manifest.sha256)"
          python scripts/release_manifests.py artifact \
            --root dist \
            --output dist/artifact-manifest.json \
            --digest-output dist/artifact-manifest.sha256 \
            --source-sha "$MANIFEST_SOURCE_SHA" \
            --version "$MANIFEST_VERSION" \
            --tag "$MANIFEST_TAG" \
            --channel "$MANIFEST_CHANNEL" \
            --source-manifest-digest "$source_manifest_digest" \
            --exclude source-manifest.json \
            --exclude source-manifest.sha256 \
            --exclude artifact-manifest.json \
            --exclude artifact-manifest.sha256

      - id: journal
        name: Initialize release transaction journal
        shell: bash
        env:
          JOURNAL_CHANNEL: ${{ inputs.release_type }}
          CANDIDATE_TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          artifact_digest="sha256:$(sha256sum dist/artifact-manifest.json | cut -d ' ' -f 1)"
          intent_input="${SOURCE_SHA}\n${CANDIDATE_TAG}\n${CANDIDATE_VERSION}\n${JOURNAL_CHANNEL}\n${artifact_digest}"
          intent_digest="sha256:$(printf '%b' "$intent_input" | sha256sum | cut -d ' ' -f 1)"
          transaction_id="cd-${GITHUB_RUN_ID}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/release_transaction.py init \
            --journal "$RUNNER_TEMP/release-journal.jsonl" \
            --transaction-id "$transaction_id" \
            --channel "$JOURNAL_CHANNEL" \
            --source-sha "$SOURCE_SHA" \
            --artifact-digest "$artifact_digest" \
            --intent-digest "$intent_digest" \
            --timestamp "$timestamp"
          {
            printf 'transaction_id=%s\n' "$transaction_id"
            printf 'artifact_digest=%s\n' "$artifact_digest"
            printf 'intent_digest=%s\n' "$intent_digest"
          } >> "$GITHUB_OUTPUT"
      - id: git-bundle
        name: Bundle prepared release commit and tag
        shell: bash
        env:
          BASE_SOURCE_SHA: ${{ github.sha }}
          PREPARED_TAG: ${{ steps.version.outputs.tag }}
          PREPARED_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_COMMIT}^")" = "$BASE_SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$PREPARED_TAG^{commit}")" = "$RELEASE_COMMIT"
          git update-ref refs/heads/release-candidate "$RELEASE_COMMIT"
          tag_object="$(git rev-parse "refs/tags/$PREPARED_TAG")"
          tag_type="$(git cat-file -t "$tag_object")"
          git bundle create dist/release.git.bundle \
            refs/heads/release-candidate \
            "refs/tags/$PREPARED_TAG" \
            "^$BASE_SOURCE_SHA"
          git bundle verify dist/release.git.bundle
          git_bundle_digest="sha256:$(sha256sum dist/release.git.bundle | cut -d ' ' -f 1)"
          jq -n \
            --arg base_source_sha "$BASE_SOURCE_SHA" \
            --arg git_bundle_sha256 "$git_bundle_digest" \
            --arg release_commit "$RELEASE_COMMIT" \
            --arg tag "$PREPARED_TAG" \
            --arg tag_object "$tag_object" \
            --arg tag_type "$tag_type" \
            --arg version "$PREPARED_VERSION" \
            '{
              schema_version: "skret-release-git/v1",
              base_source_sha: $base_source_sha,
              release_commit: $release_commit,
              tag: $tag,
              tag_object: $tag_object,
              tag_type: $tag_type,
              version: $version,
              git_bundle_sha256: $git_bundle_sha256
            }' > dist/release-git.json
          printf 'git_bundle_digest=%s\n' "$git_bundle_digest" >> "$GITHUB_OUTPUT"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: |
            dist/skret_*/skret
            dist/skret_*/skret.exe
            dist/skret-secret-helper_*/skret-secret-helper
            dist/skret-compose-supervisor_*/skret-compose-supervisor
          if-no-files-found: error
          retention-days: 7
      - name: Upload archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload checksum artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: |
            dist/CHANGELOG.md
            dist/artifacts.json
            dist/config.yaml
            dist/metadata.json
            dist/checksums.txt
            dist/auxiliary-checksums.txt
            dist/source-manifest.json
            dist/source-manifest.sha256
            dist/artifact-manifest.json
            dist/artifact-manifest.sha256
            dist/deployment-manifest.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.sbom.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload CLI OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-oci
          path: dist/skret-cli.oci.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload sync OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-oci
          path: dist/skret-sync.oci.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload ordinary Hub artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub
          path: dist/hub.bundle.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload security executor artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-executor
          path: dist/security-executor.bundle.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: dist/docs.bundle.tar
          if-no-files-found: error
          retention-days: 7
      - name: Upload release journal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-journal
          path: ${{ runner.temp }}/release-journal.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Upload prepared release Git bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-git
          path: |
            dist/release.git.bundle
            dist/release-git.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish candidate release
    # Plan Task 7A: the winning dispatch run uploads immutable assets, signs
    # the checksum manifest (keyless cosign bundle), attests build provenance,
    # and binds the tag/release identity to the prepare job's outputs. Any
    # drift between the recomputed and prepared identity fails before upload.
    # Stable-channel dispatch remains an explicit user gate.
    needs: [prepare]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.release_type == 'beta' && 'beta-publish' || 'stable-publish' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.cas.outputs.tag }}
      version: ${{ steps.cas.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - id: cas
        name: Verify and atomically push the prepared release identity
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ needs.prepare.outputs.git_bundle_digest }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_VERSION"
          test -n "$EXPECTED_TAG"
          test -n "$EXPECTED_RELEASE_COMMIT"
          test "sha256:$(sha256sum dist/release.git.bundle | cut -d ' ' -f 1)" = "$EXPECTED_BUNDLE_DIGEST"
          test "$(jq -er .git_bundle_sha256 dist/release-git.json)" = "$EXPECTED_BUNDLE_DIGEST"
          test "$(jq -er .base_source_sha dist/release-git.json)" = "$EXPECTED_SHA"
          test "$(jq -er .release_commit dist/release-git.json)" = "$EXPECTED_RELEASE_COMMIT"
          test "$(jq -er .tag dist/release-git.json)" = "$EXPECTED_TAG"
          test "$(jq -er .version dist/release-git.json)" = "$EXPECTED_VERSION"
          git bundle verify dist/release.git.bundle
          git fetch dist/release.git.bundle \
            refs/heads/release-candidate:refs/heads/release-candidate \
            "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          test "$(git rev-parse "refs/heads/release-candidate^")" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/heads/release-candidate")" = "$EXPECTED_RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$EXPECTED_TAG")" = "$(jq -er .tag_object dist/release-git.json)"
          test "$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")" = "$EXPECTED_RELEASE_COMMIT"

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          remote_tag="$(git ls-remote origin "refs/tags/$EXPECTED_TAG" | cut -f1)"
          prepared_tag="$(git rev-parse "refs/tags/$EXPECTED_TAG")"
          if [ "$remote_main" = "$EXPECTED_SHA" ] && [ -z "$remote_tag" ]; then
            git push --atomic origin \
              refs/heads/release-candidate:refs/heads/main \
              "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          elif [ "$remote_main" != "$EXPECTED_RELEASE_COMMIT" ] || [ "$remote_tag" != "$prepared_tag" ]; then
            echo "remote release refs drifted from the exact prepared transaction" >&2
            exit 1
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_RELEASE_COMMIT"
          test "$(git ls-remote origin "refs/tags/$EXPECTED_TAG" | cut -f1)" = "$prepared_tag"
          {
            printf 'version=%s\n' "$EXPECTED_VERSION"
            printf 'tag=%s\n' "$EXPECTED_TAG"
            printf 'release_commit=%s\n' "$EXPECTED_RELEASE_COMMIT"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify Cosign version before signing
        run: |
          cosign version --json |
            python scripts/repo-bootstrap/verify_cosign_version.py v3.0.6
      - name: Sign checksum manifest
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
      - name: Build exact create-once release manifest
        env:
          CHANNEL: ${{ inputs.release_type }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.cas.outputs.release_commit }}
          EXPECTED_TAG: ${{ steps.cas.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import mimetypes
          import os
          from pathlib import Path

          dist = Path("dist")
          fixed_names = {
              "CHANGELOG.md",
              "artifact-manifest.json",
              "artifact-manifest.sha256",
              "artifacts.json",
              "auxiliary-checksums.txt",
              "checksums.txt",
              "checksums.txt.bundle",
              "cli-oci.sbom.json",
              "config.yaml",
              "deployment-manifest.sha256",
              "docs.bundle.tar",
              "docs.sbom.json",
              "hub.bundle.tar",
              "hub.sbom.json",
              "metadata.json",
              "release-journal.jsonl",
              "security-executor.bundle.tar",
              "security-executor.sbom.json",
              "skret-cli.oci.tar",
              "skret-sync.oci.tar",
              "source-manifest.json",
              "source-manifest.sha256",
              "sync-oci.sbom.json",
          }
          generated_names = {
              path.name
              for pattern in ("*.tar.gz", "*.zip", "*.sbom.json")
              for path in dist.glob(pattern)
          }
          asset_names = sorted(fixed_names | generated_names)
          missing = [name for name in asset_names if not (dist / name).is_file()]
          if missing:
              raise SystemExit(f"release assets missing: {missing}")
          if any(name in {"release.git.bundle", "release-git.json"} for name in asset_names):
              raise SystemExit("internal release Git handoff entered release asset set")

          asset_set = []
          for name in asset_names:
              path = dist / name
              content = path.read_bytes()
              content_type = mimetypes.guess_type(name)[0] or "application/octet-stream"
              asset_set.append(
                  {
                      "name": name,
                      "path": path.as_posix(),
                      "size": len(content),
                      "sha256": "sha256:" + hashlib.sha256(content).hexdigest(),
                      "content_type": content_type,
                  }
              )

          tag = os.environ["EXPECTED_TAG"]
          channel = os.environ["CHANNEL"]
          release_body = Path("release-body.md")
          release_body.write_bytes((dist / "CHANGELOG.md").read_bytes())
          manifest = {
              "schema_version": "bsr-release-manifest/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "transaction_id": (
                  f"skret-release-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "tag": tag,
              "target_sha": os.environ["EXPECTED_RELEASE_COMMIT"],
              "release": {
                  "name": tag,
                  "body_path": release_body.as_posix(),
                  "body_sha256": hashlib.sha256(release_body.read_bytes()).hexdigest(),
                  "draft": False,
                  "prerelease": channel == "beta",
                  "make_latest": channel == "stable",
              },
              "assets": asset_set,
          }
          Path("release-manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=False,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - id: publisher
        name: Publish exact release assets through signed G1 publisher
        uses: n24q02m/better-semantic-release/publish-action@096ba88af5df375b958212a9fbc6b80ab66888d7 # v1.6.0-beta.8 G1 generation 3
        with:
          manifest: release-manifest.json
          token: ${{ steps.app-token.outputs.token }}
      - name: Read back exact published release
        env:
          ASSET_SET_SHA256: ${{ steps.publisher.outputs.asset_set_sha256 }}
          CREATED: ${{ steps.publisher.outputs.created }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.cas.outputs.release_commit }}
          EXPECTED_TAG: ${{ steps.cas.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISH_TRANSACTION_ID: ${{ steps.publisher.outputs.transaction_id }}
          RESULT_SHA256: ${{ steps.publisher.outputs.result_sha256 }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TRANSACTION_ID"
          test -n "$ASSET_SET_SHA256"
          test -n "$RESULT_SHA256"
          case "$CREATED" in true|false|True|False) ;; *) exit 1 ;; esac
          test "$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")" = "$EXPECTED_RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" > release.json
          python3 - <<'PY'
          import json
          import os

          manifest = json.load(open("release-manifest.json", encoding="utf-8"))
          release = json.load(open("release.json", encoding="utf-8"))
          assert release["tag_name"] == os.environ["EXPECTED_TAG"]
          # target_commitish is creation-time metadata: for a release attached to a
          # pre-existing tag, GitHub reports the default branch here, not the SHA.
          # The tag->commit binding is already enforced by the git rev-parse check above.
          assert release["draft"] is False
          assert release["prerelease"] is manifest["release"]["prerelease"]
          expected = {
              asset["name"]: (asset["size"], asset["sha256"])
              for asset in manifest["assets"]
          }
          observed = {
              asset["name"]: (asset["size"], asset["digest"])
              for asset in release["assets"]
          }
          assert observed == expected
          PY
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/skret-cli.oci.tar
            dist/skret-sync.oci.tar
            dist/hub.bundle.tar
            dist/security-executor.bundle.tar
            dist/docs.bundle.tar

  installer-smoke:
    name: Release installer smoke (${{ matrix.os }})
    # Plan Task 7A: verify Windows and native ARM64 install using the exact
    # published candidate artifacts. Installs the exact tag and asserts the
    # reported version; the arm64 leg runs on a native arm64 runner.
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify Cosign version before install
        run: |
          cosign version --json |
            python scripts/repo-bootstrap/verify_cosign_version.py v3.0.6
      - name: Install exact candidate (Unix)
        if: runner.os != 'Windows'
        env:
          CANDIDATE_TAG: ${{ needs.publish.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ./install.sh --user --quiet --version="$CANDIDATE_TAG"
          out="$("$HOME/.local/bin/skret" --version)"
          echo "$out"
          case "$out" in
            *"$EXPECTED_VERSION"*) ;;
            *) echo "version mismatch: $out" >&2; exit 1 ;;
          esac
      - name: Install exact candidate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ needs.publish.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & pwsh -NoProfile -File .\install.ps1 -Version $env:CANDIDATE_TAG -Quiet
          $exe = "$env:LOCALAPPDATA\Programs\skret\skret.exe"
          $out = & $exe --version
          Write-Output $out
          if ($out -notlike "*$($env:EXPECTED_VERSION)*") { throw "version mismatch: $out" }
