name: Bot PR Governance

on:
  pull_request:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Only govern pull requests whose branch lives in this repository.
    #
    # Technically: a pull_request run from a fork gets a read-only GITHUB_TOKEN
    # whatever the permissions block above asks for, and `gh pr close` and
    # `gh pr comment` are both unguarded under `set -e`, so the job would fail.
    #
    # More importantly: what it would be trying to do there is close an
    # outsider's pull request because somebody else's bot spent the day's rate
    # limit. Every bot this governs pushes its branch into this repository, so
    # nothing is lost by not running.
    #
    # Comparing head.repo.full_name against the repository asks whether the
    # branch lives here. head.repo.fork answers a different question — whether
    # the source repository is itself a fork — which would silently disable
    # governance for internal branches if this repository ever became one.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh label create "bot-generated" --repo "$REPO" --force \
            --color "6E40C9" --description "Pull request created by an automated bot."
          gh label create "possible-duplicate" --repo "$REPO" --force \
            --color "FBCA04" --description "Potentially duplicates another open pull request."
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO"

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state all --limit 1000 \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length")

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Re-proposal of an already-rejected change ---
          #
          # The rate limit above caps how fast a bot files PRs; it does nothing
          # about the same idea coming back on a new branch a few days later,
          # under the day's quota each time. That is the shape the backlog
          # actually grows in: on 2026-08-08 seven of fourteen open bot PRs were
          # re-proposals of a change already reviewed and declined.
          #
          # Signature is the set of production files touched, with .jules/
          # excluded because every bot PR appends to its own ledger and would
          # otherwise look distinct. An exact match against a bot PR that was
          # closed WITHOUT being merged in the last 30 days means a human has
          # already read this change and said no.
          #
          # Merged PRs are deliberately not signatures: touching the same file
          # as a landed change is normal iteration, not a re-proposal.
          #
          # Closing is reversible -- the comment names the earlier PR and says
          # how to reopen, so a genuine second attempt costs one click.
          BOT_BRANCH_RE='^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])|-[0-9]{14,}$'
          SIG=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files \
                 --jq '[.files[].path | select(startswith(".jules/") | not)] | sort | join(",")')

          if [ -z "$SIG" ]; then
            echo "PR touches only ledger files, skipping re-proposal check."
          else
            echo "Production file signature: $SIG"
            SINCE_30D=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                        date -u -v-30d +%Y-%m-%dT%H:%M:%SZ)
            REJECTED=$(gh pr list --repo "$REPO" --state closed --limit 1000 \
                        --json number,closedAt,mergedAt,headRefName \
                        --jq "[.[] |
                               select(.mergedAt == null) |
                               select(.closedAt > \"$SINCE_30D\") |
                               select(.headRefName | test(\"$BOT_BRANCH_RE\")) |
                               .number] | .[]")

            for PREV in $REJECTED; do
              PREV_SIG=$(gh pr view "$PREV" --repo "$REPO" --json files \
                          --jq '[.files[].path | select(startswith(".jules/") | not)] | sort | join(",")')
              if [ "$PREV_SIG" = "$SIG" ]; then
                gh pr close "$PR_NUMBER" --repo "$REPO" --comment \
                  "**Already declined**: this PR touches exactly the production files that #${PREV} touched, and #${PREV} was closed without being merged. Re-filing a reviewed-and-declined change on a new branch is what this check exists to stop. Read the closing comment on #${PREV} first -- it states the technical reason. If that reason no longer holds, or this PR differs in a way the file list cannot show, reopen with the difference stated in the description."
                echo "PR #$PR_NUMBER closed: same file signature as rejected #$PREV"
                exit 0
              fi
            done
            echo "No rejected bot PR shares this file signature."
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD in:title" --limit 1000 \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   )

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate"
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open\`"
          fi
