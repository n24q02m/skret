name: Demo GIF

on:
  push:
    branches: [main]
    paths:
      # demo.tape only, deliberately. This file used to be in the list too, and
      # a re-render is never byte-identical (the cursor blink alone shifts the
      # frames), so every edit here opened a "regenerate demo.gif" PR -- 750 KB
      # of binary into history for a picture nobody could tell apart. Changing
      # how the workflow authenticates (#656) triggered exactly that (#659).
      # demo.tape is what decides what the demo shows; this file is how it gets
      # built. For the rarer case where a change here really does alter the
      # render -- vhs version, font, terminal size -- run it by hand from the
      # Actions tab.
      - "demo.tape"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The App token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN does not
      # trigger workflows, so every demo.gif PR arrived with zero checks and
      # looked clean because nothing had run. The old expression named a
      # secrets.GH_PAT that does not exist on this repo (we use a GitHub App,
      # not PATs), so it always fell through to GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install VHS toolchain (ffmpeg + ttyd + vhs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-jetbrains-mono
          # ttyd: install from official release (apt package missing on Noble)
          curl -sSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /tmp/ttyd && sudo mv /tmp/ttyd /usr/local/bin/ttyd
          # vhs: install via Go since vhs-action ffmpeg install broken on Ubuntu 24.04 (upstream #459)
          go install github.com/charmbracelet/vhs@v0.10.0
      - name: Build skret
        run: |
          go build -o /usr/local/bin/skret ./cmd/skret
          skret --version
      - name: Render demo.gif
        run: |
          export PATH="$HOME/go/bin:$PATH"
          vhs demo.tape
      - name: Copy demo.gif into docs/public
        run: |
          mkdir -p docs/public
          cp demo.gif docs/public/demo.gif
      - name: Upload demo.gif artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: |
            demo.gif
            docs/public/demo.gif
          retention-days: 30
      - name: Open PR with updated demo.gif
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # This is the one that decides the PR's author identity, and so
          # whether CI runs on it at all.
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "feat: regenerate demo.gif"
          title: "feat: regenerate demo.gif"
          body: "Auto-generated by Demo GIF workflow. Review the render visually before merging."
          branch: chore/regenerate-demo-gif
          delete-branch: true
          add-paths: |
            demo.gif
            docs/public/demo.gif
