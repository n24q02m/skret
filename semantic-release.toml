[semantic_release]
tag_format = "v{version}"
commit_message = "fix(release): v{version} [skip ci]"
major_on_zero = false

[semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[semantic_release.remote]
type = "github"

# The protected prepare lane runs against the campaign branch before merge.
# Keep that branch explicit so unrelated branches cannot produce candidates.
[semantic_release.branches.candidate]
match = "^skret-task0-followup$"
prerelease = true
prerelease_token = "beta"
