# pre-commit hooks published by this repository. They work in any repository,
# whatever its language (Go, Python, TypeScript, ...):
#
#   repos:
#     - repo: https://github.com/n24q02m/skret
#       rev: vX.Y.Z
#       hooks:
#         - id: skret-protect
#
# skret-protect uses `language: golang`: pre-commit builds skret from the
# pinned rev, so the hook always matches `rev` and nothing has to be installed
# first. When `go` is not on PATH, pre-commit (3.0 or newer) downloads a Go
# toolchain into its own cache for the build.
#
# skret-protect-system uses `language: system`: it runs the skret already on
# PATH (Homebrew, Scoop, install.sh, ...). Nothing is built, but the version
# is whatever is installed, not `rev`.
#
# Both pass the staged file names to `skret protect`; pre-commit stashes
# unstaged changes first, so the files on disk hold the staged content.
- id: skret-protect
  name: skret protect
  description: Block .env files and plaintext credentials from being committed.
  entry: skret protect
  language: golang
  minimum_pre_commit_version: "3.0.0"
- id: skret-protect-system
  name: skret protect (installed skret)
  description: Block .env files and plaintext credentials from being committed, using the skret on PATH.
  entry: skret protect
  language: system
